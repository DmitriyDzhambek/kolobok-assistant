<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0C10" />
    <meta name="background-color" content="#0B0C10" />
    <meta
      name="description"
      content="Колобок — сказочный голосовой помощник для рабочего стола: ты отдыхай, а я для тебя заработаю."
    />
    <!-- Telegram Mini App Meta Tags -->
    <meta property="og:title" content="Колобок - Магия Дохода" />
    <meta property="og:description" content="Сказочный голосовой помощник для рабочего стола" />
    <meta property="og:image" content="https://your-domain.com/icon-512x512.png" />
    <!-- For iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Колобок" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <!-- For Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Disable pull-to-refresh -->
    <meta name="msapplication-tap-highlight" content="no" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Шрифты грузим неблокирующе: без сети страница всё равно рисуется сразу -->
    <link
      href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Neucha&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Neucha&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Ты отдыхай, а я для тебя заработаю — Колобок</title>
    <!-- Telegram Mini App SDK: внутри Telegram даёт window.Telegram.WebApp.
         async — чтобы недоступный telegram.org никогда не блокировал отрисовку;
         tma.ts сам дождётся SDK после загрузки. -->
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
